spring:
  datasource:
    url: jdbc:h2:mem:buildflow-test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

buildflow:
  jwt:
    secret: test-secret-key-for-jwt-signing-in-unit-and-integration-tests-only
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
  cors:
    allowed-origins: http://localhost:5173
